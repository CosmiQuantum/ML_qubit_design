<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 560 590"
     font-family="'Helvetica Neue', Arial, Helvetica, sans-serif">
<rect width="560" height="590" fill="#FFFFFF"/>
<defs>
    <marker id="arrowMain" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555555"/>
    </marker>
    <marker id="arrowOut" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555555"/>
    </marker>
    <marker id="arrowFb" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3F6F8B"/>
    </marker>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.25"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>


<rect x="138" y="20" width="284" height="48" rx="10" ry="10"
        fill="#D6E5EE" stroke="#567A90" stroke-width="2"
        filter="url(#softShadow)"/>
  <text x="280" y="50" text-anchor="middle"
        font-size="17" font-weight="bold" fill="#222222">
    Desired Hamiltonian Input
  </text>


<rect x="64" y="88" width="432" height="410" rx="16" ry="16"
        fill="#FFFFFF" stroke="#3F6F8B" stroke-width="2.5"
        stroke-dasharray="8,4"
        filter="url(#softShadow)"/>
<text x="480" y="116" text-anchor="end"
        font-size="15" font-style="italic" font-weight="bold"
        fill="#3F6F8B">Training</text>

<line x1="280" y1="72" x2="280" y2="102"
        stroke="#555555" stroke-width="3.2"/>
<polygon points="280,112 273,100 287,100" fill="#555555"/>

<rect x="210" y="106" width="140" height="54" rx="10" ry="10"
        fill="#B0CCDE" stroke="#3F6F8B" stroke-width="2"/>
  <text x="280" y="129" text-anchor="middle"
        font-size="16" font-weight="bold" fill="#222222">Inverse</text>
  <text x="280" y="148" text-anchor="middle"
        font-size="16" font-weight="bold" fill="#222222">MLP</text>

<line x1="280" y1="164" x2="280" y2="178"
        stroke="#555555" stroke-width="3.2"/>
<polygon points="280,188 273,176 287,176" fill="#555555"/>

<rect x="122" y="188" width="316" height="46" rx="10" ry="10"
        fill="#B0CCDE" stroke="#3F6F8B" stroke-width="2"/>
  <text x="280" y="216" text-anchor="middle"
        font-size="16" font-weight="bold" fill="#333333">
    Best Quantum Metal Parameter Guess
  </text>

<line x1="280" y1="238" x2="280" y2="252"
        stroke="#555555" stroke-width="3.2"/>
<polygon points="280,262 273,250 287,250" fill="#555555"/>

<rect x="172" y="262" width="216" height="58" rx="10" ry="10"
        fill="#B0CCDE" stroke="#3F6F8B" stroke-width="2"/>
  <text x="280" y="285" text-anchor="middle"
        font-size="16" font-weight="bold" fill="#333333">Ansys Surrogate</text>
  <text x="280" y="304" text-anchor="middle"
        font-size="16" font-weight="bold" fill="#333333">MLP</text>

<line x1="280" y1="324" x2="280" y2="338"
        stroke="#555555" stroke-width="3.2"/>
<polygon points="280,348 273,336 287,336" fill="#555555"/>

<rect x="172" y="348" width="216" height="58" rx="10" ry="10"
        fill="#B0CCDE" stroke="#3F6F8B" stroke-width="2"/>
  <text x="280" y="371" text-anchor="middle"
        font-size="16" font-weight="bold" fill="#333333">Hamiltonian</text>
  <text x="280" y="390" text-anchor="middle"
        font-size="16" font-weight="bold" fill="#333333">Reconstruction</text>

<line x1="280" y1="410" x2="280" y2="420"
        stroke="#555555" stroke-width="3.2"/>
<polygon points="280,430 273,418 287,418" fill="#555555"/>

<rect x="126" y="427" width="308" height="68" rx="10" ry="10"
        fill="#17384F" stroke="#17384F" stroke-width="2"/>
  <text x="280" y="450" text-anchor="middle"
        font-size="16" font-weight="bold" fill="#FFFFFF">Compute loss</text>
  <text x="280" y="471" text-anchor="middle"
        font-size="13" fill="#FFFFFF">Average absolute difference between</text>
  <text x="280" y="488" text-anchor="middle"
        font-size="13" fill="#FFFFFF">target and reconstructed Hamiltonian</text>

<line x1="280" y1="499" x2="280" y2="516"
        stroke="#555555" stroke-width="3.2"/>
<polygon points="280,526 273,514 287,514" fill="#555555"/>

<path d="M 126,461 L 104,461 L 104,133 L 198,133"
        fill="none" stroke="#3F6F8B" stroke-width="3.0"
        stroke-dasharray="7,4"/>
<polygon points="210,133 198,126 198,140" fill="#3F6F8B"/>
  <text x="96" y="290" text-anchor="middle"
        font-size="14" font-style="italic" fill="#3F6F8B"
        transform="rotate(-90 96 290)">
    update inverse weights
  </text>

<rect x="120" y="526" width="320" height="46" rx="10" ry="10"
        fill="#FFFFFF" stroke="#3F6F8B" stroke-width="2"
        filter="url(#softShadow)"/>
  <text x="280" y="555" text-anchor="middle"
        font-size="17" font-weight="bold" fill="#222222">
    Best Quantum Metal Design Output
  </text>

</svg>
