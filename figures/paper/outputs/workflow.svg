<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 540 753"
     font-family="'Helvetica Neue', Arial, Helvetica, sans-serif">
  <rect width="540" height="753" fill="#FFFFFF"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555555"/>
    </marker>
    <marker id="arrowFb" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3D8B3D"/>
    </marker>
  </defs>
  <rect x="79" y="88" width="257" height="182" rx="10" ry="10" fill="#FFF4E6" fill-opacity="0.45" stroke="#E87A00" stroke-width="1.5" stroke-opacity="0.55" stroke-dasharray="4,3"/>
  <text x="67" y="179.0" text-anchor="middle" font-size="10" font-weight="bold" font-style="italic" fill="#E87A00" transform="rotate(-90 67 179.0)">Physics</text>
  <rect x="79" y="270" width="257" height="182" rx="10" ry="10" fill="#E8F5E8" fill-opacity="0.45" stroke="#3D8B3D" stroke-width="1.5" stroke-opacity="0.55" stroke-dasharray="4,3"/>
  <text x="67" y="361.0" text-anchor="middle" font-size="10" font-weight="bold" font-style="italic" fill="#3D8B3D" transform="rotate(-90 67 361.0)">ML surrogate</text>
  <rect x="79" y="452" width="257" height="273" rx="10" ry="10" fill="#E8E4F0" fill-opacity="0.45" stroke="#7B68AE" stroke-width="1.5" stroke-opacity="0.55" stroke-dasharray="4,3"/>
  <text x="67" y="588.5" text-anchor="middle" font-size="10" font-weight="bold" font-style="italic" fill="#7B68AE" transform="rotate(-90 67 588.5)">Validation</text>
  <rect x="95" y="20" width="225" height="60" rx="6" ry="6" fill="#F5F5F5" stroke="#999999" stroke-width="1.5"/>
  <text x="105" y="38" font-size="12" font-weight="bold" fill="#222222">Inputs — target Hamiltonian</text>
  <text x="105" y="54" font-size="10" fill="#555555" font-family="inherit">ω_q, α, ω_r, g, κ, …</text>
  <text x="105" y="68" font-size="10" fill="#555555" font-family="inherit">(user-specified targets)</text>
  <rect x="95" y="96" width="225" height="75" rx="6" ry="6" fill="#FFF4E6" stroke="#E87A00" stroke-width="1.5"/>
  <text x="105" y="114" font-size="12" font-weight="bold" fill="#A85600">Physics mapping</text>
  <text x="105" y="130" font-size="10" fill="#222222" font-family="inherit">Convert Hamiltonian targets to</text>
  <text x="105" y="144" font-size="10" fill="#222222" font-family="inherit">ML-friendly features using</text>
  <text x="105" y="158" font-size="10" fill="#222222" font-family="inherit">analytic relations (e.g. α ≈ −E_C).</text>
  <rect x="95" y="187" width="225" height="75" rx="6" ry="6" fill="#FFF4E6" stroke="#E87A00" stroke-width="1.5"/>
  <text x="105" y="205" font-size="12" font-weight="bold" fill="#A85600">Preprocessing</text>
  <text x="105" y="221" font-size="10" fill="#222222" font-family="inherit">Scale features (min–max fit</text>
  <text x="105" y="235" font-size="10" fill="#222222" font-family="inherit">on train set); one-hot encode</text>
  <text x="105" y="249" font-size="10" fill="#222222" font-family="inherit">categoricals and “exists” masks.</text>
  <rect x="95" y="278" width="225" height="75" rx="6" ry="6" fill="#E8F5E8" stroke="#3D8B3D" stroke-width="1.5"/>
  <text x="105" y="296" font-size="12" font-weight="bold" fill="#2E6B2E">Three trained inverse MLPs</text>
  <text x="105" y="312" font-size="9" fill="#444444" font-family="Menlo, Consolas, monospace">• TransmonCross: x_q → a_q</text>
  <text x="105" y="326" font-size="9" fill="#444444" font-family="Menlo, Consolas, monospace">• Coupler / NCap: x_c → a_c</text>
  <text x="105" y="340" font-size="9" fill="#444444" font-family="Menlo, Consolas, monospace">• Cavity / res: x_r → a_r</text>
  <rect x="95" y="369" width="225" height="75" rx="6" ry="6" fill="#E8F5E8" stroke="#3D8B3D" stroke-width="1.5"/>
  <text x="105" y="387" font-size="12" font-weight="bold" fill="#2E6B2E">Postprocessing</text>
  <text x="105" y="403" font-size="10" fill="#222222" font-family="inherit">Unscale predictions back to</text>
  <text x="105" y="417" font-size="10" fill="#222222" font-family="inherit">physical units; decode rules</text>
  <text x="105" y="431" font-size="10" fill="#222222" font-family="inherit">and apply “exists” masks.</text>
  <rect x="95" y="460" width="225" height="75" rx="6" ry="6" fill="#E8E4F0" stroke="#7B68AE" stroke-width="1.5"/>
  <text x="105" y="478" font-size="12" font-weight="bold" fill="#4A3D78">Forward validation</text>
  <text x="105" y="494" font-size="10" fill="#222222" font-family="inherit">Assemble design in Quantum Metal;</text>
  <text x="105" y="508" font-size="10" fill="#222222" font-family="inherit">run Ansys Q3D (capacitance) and</text>
  <text x="105" y="522" font-size="10" fill="#222222" font-family="inherit">HFSS to extract physical values.</text>
  <rect x="95" y="551" width="225" height="75" rx="6" ry="6" fill="#E8E4F0" stroke="#7B68AE" stroke-width="1.5"/>
  <text x="105" y="569" font-size="12" font-weight="bold" fill="#4A3D78">Map back to Hamiltonian</text>
  <text x="105" y="585" font-size="10" fill="#222222" font-family="inherit">Convert capacitances & modes</text>
  <text x="105" y="599" font-size="10" fill="#222222" font-family="inherit">back to achieved ω_q, α, ω_r, g</text>
  <text x="105" y="613" font-size="10" fill="#222222" font-family="inherit">via inverse physics map.</text>
  <rect x="95" y="642" width="225" height="75" rx="6" ry="6" fill="#E8E4F0" stroke="#7B68AE" stroke-width="1.5"/>
  <text x="105" y="660" font-size="12" font-weight="bold" fill="#4A3D78">Compare and iterate</text>
  <text x="105" y="676" font-size="10" fill="#222222" font-family="inherit">RMSPE between target</text>
  <text x="105" y="690" font-size="10" fill="#222222" font-family="inherit">and achieved Hamiltonian;</text>
  <text x="105" y="704" font-size="10" fill="#222222" font-family="inherit">optionally refine targets.</text>
  <line x1="207.5" y1="80" x2="207.5" y2="96" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="207.5" y1="171" x2="207.5" y2="187" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="207.5" y1="262" x2="207.5" y2="278" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="207.5" y1="353" x2="207.5" y2="369" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="207.5" y1="444" x2="207.5" y2="460" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="207.5" y1="535" x2="207.5" y2="551" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="207.5" y1="626" x2="207.5" y2="642" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="350" y="96" width="170" height="34" rx="4" ry="4" fill="#FAFAFA" stroke="#CCCCCC" stroke-width="1"/>
  <text x="358" y="110" font-size="10" font-weight="bold" fill="#222222">target vector</text>
  <text x="358" y="124" font-size="9" font-family="Menlo, Consolas, monospace" fill="#555555">H_target = (ω_q, α, …)</text>
  <line x1="320" y1="113.0" x2="350" y2="113.0" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3,3"/>
  <rect x="350" y="187" width="170" height="46" rx="4" ry="4" fill="#FAFAFA" stroke="#CCCCCC" stroke-width="1"/>
  <text x="358" y="201" font-size="10" font-weight="bold" fill="#222222">feature vector</text>
  <text x="358" y="215" font-size="9" font-family="Menlo, Consolas, monospace" fill="#555555">x_raw ∈ R^d_in</text>
  <text x="358" y="227" font-size="9" font-family="Menlo, Consolas, monospace" fill="#555555">physical quantities</text>
  <line x1="320" y1="210.0" x2="350" y2="210.0" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3,3"/>
  <rect x="350" y="278" width="170" height="34" rx="4" ry="4" fill="#FAFAFA" stroke="#CCCCCC" stroke-width="1"/>
  <text x="358" y="292" font-size="10" font-weight="bold" fill="#222222">scaled features</text>
  <text x="358" y="306" font-size="9" font-family="Menlo, Consolas, monospace" fill="#555555">x = scaler(x_raw)</text>
  <line x1="320" y1="295.0" x2="350" y2="295.0" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3,3"/>
  <rect x="350" y="369" width="170" height="46" rx="4" ry="4" fill="#FAFAFA" stroke="#CCCCCC" stroke-width="1"/>
  <text x="358" y="383" font-size="10" font-weight="bold" fill="#222222">raw NN outputs</text>
  <text x="358" y="397" font-size="9" font-family="Menlo, Consolas, monospace" fill="#555555">a_q, a_c, a_r</text>
  <text x="358" y="409" font-size="9" font-family="Menlo, Consolas, monospace" fill="#555555">in scaled form</text>
  <line x1="320" y1="392.0" x2="350" y2="392.0" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3,3"/>
  <rect x="350" y="460" width="170" height="46" rx="4" ry="4" fill="#FAFAFA" stroke="#CCCCCC" stroke-width="1"/>
  <text x="358" y="474" font-size="10" font-weight="bold" fill="#222222">Quantum Metal params</text>
  <text x="358" y="488" font-size="9" font-family="Menlo, Consolas, monospace" fill="#555555">y_q, y_c, y_r</text>
  <text x="358" y="500" font-size="9" font-family="Menlo, Consolas, monospace" fill="#555555">+ design choices</text>
  <line x1="320" y1="483.0" x2="350" y2="483.0" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3,3"/>
  <rect x="350" y="551" width="170" height="46" rx="4" ry="4" fill="#FAFAFA" stroke="#CCCCCC" stroke-width="1"/>
  <text x="358" y="565" font-size="10" font-weight="bold" fill="#222222">extracted quantities</text>
  <text x="358" y="579" font-size="9" font-family="Menlo, Consolas, monospace" fill="#555555">C_ij matrix</text>
  <text x="358" y="591" font-size="9" font-family="Menlo, Consolas, monospace" fill="#555555">f_mode (HFSS)</text>
  <line x1="320" y1="574.0" x2="350" y2="574.0" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3,3"/>
  <rect x="350" y="642" width="170" height="34" rx="4" ry="4" fill="#FAFAFA" stroke="#CCCCCC" stroke-width="1"/>
  <text x="358" y="656" font-size="10" font-weight="bold" fill="#222222">achieved Hamiltonian</text>
  <text x="358" y="670" font-size="9" font-family="Menlo, Consolas, monospace" fill="#555555">H_pred = (ω_q, α, …)</text>
  <line x1="320" y1="659.0" x2="350" y2="659.0" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3,3"/>
  <path d="M 95,679.5 L 44,679.5 L 44,133.5 L 95,133.5" fill="none" stroke="#3D8B3D" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowFb)"/>
  <text x="38" y="406.5" text-anchor="middle" font-size="9" font-style="italic" font-weight="bold" fill="#3D8B3D" transform="rotate(-90 38 406.5)">refined targets / retry</text>
</svg>
