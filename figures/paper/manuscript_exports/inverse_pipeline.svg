<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 560 550"
     font-family="'Helvetica Neue', Arial, Helvetica, sans-serif">
<rect width="560" height="550" fill="#FFFFFF"/>
<defs>
    <marker id="arrowMain" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555555"/>
    </marker>
    <marker id="arrowOut" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555555"/>
    </marker>
    <marker id="arrowFb" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3F6F8B"/>
    </marker>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.25"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>


<rect x="138" y="20" width="284" height="48" rx="10" ry="10"
        fill="#D6E5EE" stroke="#567A90" stroke-width="2"
        filter="url(#softShadow)"/>
  <text x="280" y="50" text-anchor="middle"
        font-size="17" font-weight="bold" fill="#222222">
    Desired Hamiltonian Input
  </text>


<rect x="64" y="82" width="432" height="400" rx="16" ry="16"
        fill="#FFFFFF" stroke="#3F6F8B" stroke-width="2.5"
        stroke-dasharray="8,4"
        filter="url(#softShadow)"/>
<text x="480" y="108" text-anchor="end"
        font-size="15" font-style="italic" font-weight="bold"
        fill="#3F6F8B">Training</text>

<line x1="280" y1="72" x2="280" y2="88"
        stroke="#555555" stroke-width="3.2"/>
<polygon points="280,98 273,86 287,86" fill="#555555"/>

<rect x="210" y="96" width="140" height="54" rx="10" ry="10"
        fill="#B0CCDE" stroke="#3F6F8B" stroke-width="2"/>
  <text x="280" y="119" text-anchor="middle"
        font-size="16" font-weight="bold" fill="#222222">Inverse</text>
  <text x="280" y="138" text-anchor="middle"
        font-size="16" font-weight="bold" fill="#222222">MLP</text>

<line x1="280" y1="154" x2="280" y2="164"
        stroke="#555555" stroke-width="3.2"/>
<polygon points="280,174 273,162 287,162" fill="#555555"/>

<rect x="122" y="174" width="316" height="46" rx="10" ry="10"
        fill="#B0CCDE" stroke="#3F6F8B" stroke-width="2"/>
  <text x="280" y="202" text-anchor="middle"
        font-size="16" font-weight="bold" fill="#333333">
    Best Quantum Metal Parameter Guess
  </text>

<line x1="280" y1="224" x2="280" y2="234"
        stroke="#555555" stroke-width="3.2"/>
<polygon points="280,244 273,232 287,232" fill="#555555"/>

<rect x="172" y="244" width="216" height="58" rx="10" ry="10"
        fill="#B0CCDE" stroke="#3F6F8B" stroke-width="2"/>
  <text x="280" y="267" text-anchor="middle"
        font-size="16" font-weight="bold" fill="#333333">Ansys Surrogate</text>
  <text x="280" y="286" text-anchor="middle"
        font-size="16" font-weight="bold" fill="#333333">MLP</text>

<line x1="280" y1="306" x2="280" y2="316"
        stroke="#555555" stroke-width="3.2"/>
<polygon points="280,326 273,314 287,314" fill="#555555"/>

<rect x="172" y="326" width="216" height="58" rx="10" ry="10"
        fill="#B0CCDE" stroke="#3F6F8B" stroke-width="2"/>
  <text x="280" y="349" text-anchor="middle"
        font-size="16" font-weight="bold" fill="#333333">Hamiltonian</text>
  <text x="280" y="368" text-anchor="middle"
        font-size="16" font-weight="bold" fill="#333333">Reconstruction</text>

<line x1="280" y1="388" x2="280" y2="393"
        stroke="#555555" stroke-width="3.2"/>
<polygon points="280,403 273,391 287,391" fill="#555555"/>

<rect x="126" y="405" width="308" height="72" rx="10" ry="10"
        fill="#17384F" stroke="#17384F" stroke-width="2"/>
  <text x="280" y="425" text-anchor="middle"
        font-size="16" font-weight="bold" fill="#FFFFFF">Compute loss</text>
  <text x="280" y="446" text-anchor="middle"
        font-size="13" fill="#FFFFFF">Average absolute difference between</text>
  <text x="280" y="463" text-anchor="middle"
        font-size="13" fill="#FFFFFF">target and reconstructed Hamiltonian</text>

<line x1="280" y1="481" x2="280" y2="491"
        stroke="#555555" stroke-width="3.2"/>
<polygon points="280,501 273,489 287,489" fill="#555555"/>

<path d="M 126,441 L 104,441 L 104,123 L 198,123"
        fill="none" stroke="#3F6F8B" stroke-width="3.0"
        stroke-dasharray="7,4"/>
<polygon points="210,123 198,116 198,130" fill="#3F6F8B"/>
  <text x="96" y="275" text-anchor="middle"
        font-size="14" font-style="italic" fill="#3F6F8B"
        transform="rotate(-90 96 275)">
    update inverse weights
  </text>

<rect x="120" y="499" width="320" height="46" rx="10" ry="10"
        fill="#FFFFFF" stroke="#3F6F8B" stroke-width="2"
        filter="url(#softShadow)"/>
  <text x="280" y="528" text-anchor="middle"
        font-size="17" font-weight="bold" fill="#222222">
    Best Quantum Metal Design Output
  </text>

</svg>
